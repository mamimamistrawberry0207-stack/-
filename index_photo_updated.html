<style>
:root{--pink:#ff70b2;--purple:#8f72ff;--ink:#423347;--muted:#907f92;--line:#efdce9}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:linear-gradient(180deg,#fff5fb,#f7f5ff);min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:17px 16px 12px}
.wrap{max-width:900px;margin:auto;padding:14px}header .wrap{padding:0}h1{font-size:21px;margin:0 0 2px}.small{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}
.progress{height:8px;background:#eee3ee;border-radius:99px;overflow:hidden;margin:10px 0 15px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));transition:.2s}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,button{font:inherit}input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:white;color:var(--ink)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.actions button{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;font-weight:700;color:var(--ink)}.primary{background:linear-gradient(90deg,var(--pink),var(--purple))!important;color:white!important;border:0!important}
.hint{font-size:11px;color:var(--muted);line-height:1.6;margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card-photo{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:13px;margin-bottom:8px;background:#faf5fb;border:1px solid var(--line)}.photo-placeholder{width:100%;aspect-ratio:3/4;border-radius:13px;margin-bottom:8px;background:linear-gradient(135deg,#fff5fb,#f3efff);border:1px dashed #d9bfd3;display:flex;align-items:center;justify-content:center;color:#a28da0;font-size:12px}.photo-actions{display:flex;gap:6px;margin-top:7px}.photo-actions button{flex:1;padding:7px 4px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:10px;font-weight:700}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:11px;box-shadow:0 4px 14px #c9a9c526}.card.have{border-color:#dc9fc3}.num{font-size:13px;font-weight:800}.rarity{display:inline-block;background:#f3edf8;border-radius:8px;padding:3px 7px;font-size:9px;font-weight:800;margin-top:5px}.card h3{font-size:12px;min-height:30px;margin:9px 0}.muted{color:#b2a4b4}.meta{font-size:10px;color:var(--muted);min-height:15px}.counter{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.counter button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px}.counter b{min-width:24px;text-align:center}.edit{width:100%;margin-top:7px;padding:7px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:10px}
.modal{position:fixed;inset:0;background:#24172866;display:none;align-items:end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:600px;margin:auto 0 0;border-radius:24px 24px 0 0;padding:17px;max-height:90vh;overflow:auto}.sheet h2{font-size:18px;margin:0 0 10px}.field{margin:9px 0}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer{display:flex;gap:8px;margin-top:12px}.footer button{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px}.footer .save{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;border:0}

<body>
<header><div class="wrap"><h1>アイカツ！アンコール</h1><div class="small">所持カードコレクション</div></div></header>
<main class="wrap">
<div class="stats"><div class="stat"><b id="owned">0</b><span>所持種類</span></div><div class="stat"><b id="total">0</b><span>登録カード</span></div><div class="stat"><b id="percent">0%</b><span>コンプ率</span></div></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="controls"><input id="search" placeholder="番号・名前・メモで検索"><select id="setFilter"><option value="">すべての弾</option></select><select id="rarityFilter"><option value="">レアリティ</option><option>N</option><option>R</option><option>SR</option><option>PR</option><option>ER</option><option>PARALLEL</option></select><select id="haveFilter"><option value="">すべて</option><option value="have">持っている</option><option value="missing">未所持</option></select></div>
<div class="actions"><button class="primary" onclick="addCard()">＋ カード追加</button><button onclick="backup()">バックアップ</button><button onclick="$('file').click()">復元</button><button onclick="resetOwned()">所持数リセット</button><input id="file" type="file" accept=".json" hidden><input id="photoFile" type="file" accept="image/*" hidden></div>
<div class="hint">カードをタップして編集。2弾以降も「カード追加」から登録できます。データはこの端末に保存されます。</div>
<section id="grid" class="grid"></section>
</main>
<div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle">カードを編集</h2>
<div class="field"><label>カード番号</label><input id="fId"></div><div class="field"><label>カード名</label><input id="fName"></div>
<div class="row"><div class="field"><label>弾</label><input id="fSet"></div><div class="field"><label>レアリティ</label><input id="fRarity"></div></div>
<div class="row"><div class="field"><label>タイプ</label><input id="fType"></div><div class="field"><label>カテゴリ</label><input id="fCategory"></div></div>
<div class="field"><label>ブランド</label><input id="fBrand"></div><div class="field"><label>メモ</label><input id="fMemo"></div><div class="field"><label>所持数</label><input id="fOwned" type="number" min="0"></div>
<div class="footer"><button onclick="closeModal()">キャンセル</button><button class="save" onclick="saveCard()">保存</button></div></div></div>

const KEY="aikatsuEncorePWA_v1";
let cards=JSON.parse(localStorage.getItem(KEY)||"null")||STARTER;
let editing=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function persist(){localStorage.setItem(KEY,JSON.stringify(cards));render();}
function render(){
  const q=$("search").value.toLowerCase().trim();
  const sf=$("setFilter").value, hf=$("haveFilter").value, rf=$("rarityFilter").value;
  const sets=[...new Set(cards.map(c=>c.set).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  $("setFilter").innerHTML='<option value="">すべての弾</option>'+sets.map(s=>`<option value="${esc(s)}" ${s===sf?"selected":""}>${esc(s)}</option>`).join("");
  let list=cards.filter(c=>{
    const hay=[c.id,c.name,c.rarity,c.type,c.category,c.brand,c.memo,c.set].join(" ").toLowerCase();
    return (!q||hay.includes(q))&&(!sf||c.set===sf)&&(!rf||c.rarity===rf)&&(!hf||(hf==="have"?c.owned>0:c.owned===0));
  }).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  $("grid").innerHTML=list.map(c=>`
    <article class="card ${c.owned>0?"have":""}">
      ${c.photo?`<img class="card-photo" src="${c.photo}" alt="${esc(c.name||c.id)}">`:`<div class="photo-placeholder">📷 写真未登録</div>`}

      <h3>${c.name?esc(c.name):'<span class="muted">カード名未登録</span>'}</h3>
      <div class="meta">${esc([c.type,c.category,c.brand].filter(Boolean).join("・"))}</div>
      <div class="counter"><button onclick="change('${encodeURIComponent(c.id)}',-1)">−</button><b>${c.owned||0}</b><button onclick="change('${encodeURIComponent(c.id)}',1)">＋</button></div>
      <button class="edit" onclick="editCard('${encodeURIComponent(c.id)}')">編集</button>
      <div class="photo-actions"><button onclick="choosePhoto('${encodeURIComponent(c.id)}')">📷 写真登録</button>${c.photo?`<button onclick="removePhoto('${encodeURIComponent(c.id)}')">🗑️ 写真削除</button>`:""}</div>
    </article>`).join("");
  const owned=cards.filter(c=>c.owned>0).length;
  const total=cards.length, p=Math.round(owned/Math.max(total,1)*100);
  $("owned").textContent=owned;$("total").textContent=total;$("percent").textContent=p+"%";$("bar").style.width=p+"%";
}
function change(id,d){const c=cards.find(x=>x.id===decodeURIComponent(id));if(c){c.owned=Math.max(0,(c.owned||0)+d);persist();}}
function openModal(c,isNew=false){
  editing=isNew?null:c.id;
  $("modalTitle").textContent=isNew?"カードを追加":"カードを編集";
  [["fId","id"],["fName","name"],["fSet","set"],["fRarity","rarity"],["fType","type"],["fCategory","category"],["fBrand","brand"],["fMemo","memo"],["fOwned","owned"]].forEach(([a,b])=>$(a).value=c[b]??"");
  $("modal").classList.add("show");
}
function editCard(id){const c=cards.find(x=>x.id===decodeURIComponent(id));if(c)openModal(c);}
function addCard(){openModal({id:"",set:"2弾",name:"",rarity:"",type:"",category:"",brand:"",owned:0,memo:""},true);}
function closeModal(){$("modal").classList.remove("show");}
function saveCard(){
  const v={id:$("fId").value.trim(),name:$("fName").value.trim(),set:$("fSet").value.trim(),rarity:$("fRarity").value.trim(),type:$("fType").value.trim(),category:$("fCategory").value.trim(),brand:$("fBrand").value.trim(),memo:$("fMemo").value.trim(),owned:Math.max(0,Number($("fOwned").value)||0)};
  if(!v.id){alert("カード番号を入力してね");return;}
  if(editing){const i=cards.findIndex(x=>x.id===editing);if(i>=0){v.photo=cards[i].photo;cards[i]=v;}}
  else {if(cards.some(x=>x.id===v.id)){alert("そのカード番号は登録済みです");return;}cards.push(v);}
  closeModal();persist();
}
function backup(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:"application/json"}));
  a.download="aikatsu-encore-backup.json";a.click();URL.revokeObjectURL(a.href);
}
$("file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;cards=d;persist();alert("バックアップを復元しました！")}catch{alert("読み込みに失敗しました")}};
  r.readAsText(f);e.target.value="";
});
let photoTargetId=null;
function choosePhoto(id){photoTargetId=decodeURIComponent(id);$("photoFile").click();}
function resizeImage(file,maxSize=900,quality=0.82){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxSize/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",quality));};img.onerror=reject;img.src=reader.result;};reader.onerror=reject;reader.readAsDataURL(file);});}
$("photoFile").addEventListener("change",async e=>{const file=e.target.files[0];if(!file||!photoTargetId)return;const c=cards.find(x=>x.id===photoTargetId);if(!c)return;try{c.photo=await resizeImage(file);persist();}catch{alert("写真の読み込みに失敗しました");}e.target.value="";photoTargetId=null;});
function removePhoto(id){const c=cards.find(x=>x.id===decodeURIComponent(id));if(!c)return;if(confirm("このカードの写真を削除しますか？")){delete c.photo;persist();}}
function resetOwned(){if(confirm("所持数をすべて0にしますか？")){cards.forEach(c=>c.owned=0);persist();}}
["search","setFilter","rarityFilter","haveFilter"].forEach(id=>$(id).addEventListener("input",render));
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
render();
</script></body></html>
