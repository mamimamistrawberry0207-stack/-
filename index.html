:root{--pink:#ff70b2;--purple:#8f72ff;--ink:#423347;--muted:#907f92;--line:#efdce9}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:linear-gradient(180deg,#fff5fb,#f7f5ff);min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:17px 16px 12px}

<body>
<header><div class="wrap"><h1>アイカツ！アンコール</h1><div class="small">所持カードコレクション</div></div></header>
<main class="wrap">
<div class="stats"><div class="stat"><b id="owned">0</b><span>所持種類</span></div><div class="stat"><b id="total">0</b><span>登録カード</span></div><div class="stat"><b id="percent">0%</b><span>コンプ率</span></div></div>

<div class="controls"><input id="search" placeholder="番号・名前・メモで検索"><select id="setFilter"><option value="">すべての弾</option></select><select id="rarityFilter"><option value="">レアリティ</option><option>N</option><option>R</option><option>SR</option><option>PR</option><option>ER</option><option>PARALLEL</option></select><select id="haveFilter"><option value="">すべて</option><option value="have">持っている</option><option value="missing">未所持</option></select><select id="categoryFilter">

<div class="actions"><button class="primary" onclick="addCard()">＋ カード追加</button><button onclick="backup()">バックアップ</button><button onclick="$('file').click()">復元</button><button onclick="resetOwned()">所持数リセット</button><input id="file" type="file" accept=".json" hidden><input id="photoFile" type="file" accept="image/*" hidden></div>

</main>

</div>

<div class="footer"><button onclick="closeModal()">キャンセル</button><button class="save" onclick="saveCard()">保存</button></div></div></div>

const KEY="aikatsuEncorePWA_v1";

const DB_NAME="aikatsuEncorePhotos";

const DB_VERSION=1;

const STORE_NAME="photos";

let cards=JSON.parse(localStorage.getItem(KEY)||"null")||STARTER;

let editing=null;

let photoTargetId=null;

let brandFilter=null;

let renderToken=0;

const photoUrls=new Map();

const $=id=>document.getElementById(id);

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

cards.forEach(c=>delete c.memo);

function openDB(){

  return new Promise((resolve,reject)=>{

    const req=indexedDB.open(DB_NAME,DB_VERSION);

    req.onupgradeneeded=()=>{

      const db=req.result;

      if(!db.objectStoreNames.contains(STORE_NAME)){

        db.createObjectStore(STORE_NAME);

      }

    };

    req.onsuccess=()=>resolve(req.result);

    req.onerror=()=>reject(req.error);

  });

}

async function savePhoto(id,blob){

  const db=await openDB();

  return new Promise((resolve,reject)=>{

    const tx=db.transaction(STORE_NAME,"readwrite");

    tx.objectStore(STORE_NAME).put(blob,id);

    tx.oncomplete=()=>{db.close();resolve();};

    tx.onerror=()=>{db.close();reject(tx.error);};

  });

}

async function getPhoto(id){

  const db=await openDB();

  return new Promise((resolve,reject)=>{

    const tx=db.transaction(STORE_NAME,"readonly");

    const req=tx.objectStore(STORE_NAME).get(id);

    req.onsuccess=()=>resolve(req.result||null);

    req.onerror=()=>reject(req.error);

    tx.oncomplete=()=>db.close();

  });

}

async function deletePhoto(id){

  const db=await openDB();

  return new Promise((resolve,reject)=>{

    const tx=db.transaction(STORE_NAME,"readwrite");

    tx.objectStore(STORE_NAME).delete(id);

    tx.oncomplete=()=>{db.close();resolve();};

    tx.onerror=()=>{db.close();reject(tx.error);};

  });

}

async function clearPhotoDB(){

  const db=await openDB();

  return new Promise((resolve,reject)=>{

    const tx=db.transaction(STORE_NAME,"readwrite");

    tx.objectStore(STORE_NAME).clear();

    tx.oncomplete=()=>{db.close();resolve();};

    tx.onerror=()=>{db.close();reject(tx.error);};

  });

}

function persist(){

  cards.forEach(c=>delete c.memo);

  localStorage.setItem(KEY,JSON.stringify(cards));

  render();

}

function ensureBrandFilter(){

  if(brandFilter)return;

  brandFilter=document.createElement("select");

  brandFilter.id="brandFilter";

  brandFilter.innerHTML='<option value="">すべてのブランド</option>';

  brandFilter.addEventListener("input",render);

  $("setFilter").insertAdjacentElement("afterend",brandFilter);

}

function clearPhotoUrls(){

  photoUrls.forEach(url=>URL.revokeObjectURL(url));

  photoUrls.clear();

}

    ].join(" ").toLowerCase();

    return (!q||hay.includes(q))

      &&(!sf||c.set===sf)

      &&(!rf||c.rarity===rf)

      &&(!bf||c.brand===bf)

      &&(!hf||(hf==="have"?c.owned>0:c.owned===0))
      &&(!cf||c.type===cf);
  }).sort((a,b)=>

    String(a.id).localeCompare(String(b.id),undefined,{numeric:true})

  );

  clearPhotoUrls();

  $("grid").innerHTML=list.map(c=>`

    <article class="card ${c.owned>0?"have":""}">

      <div class="photo-area" data-photo-id="${esc(c.id)}">

        <div class="photo-placeholder">📷 写真読み込み中…</div>

      </div>

      <div class="num">${esc(c.id)}</div>

      <div class="rarity">${esc(c.rarity||"未設定")}</div>

      <h3>${c.name?esc(c.name):'<span class="muted">カード名未登録</span>'}</h3>

      <div class="meta">${esc([c.type,c.category,c.brand].filter(Boolean).join("・"))}</div>

      <div class="counter">

        <button onclick="change('${encodeURIComponent(c.id)}',-1)">−</button>

        <b>${c.owned||0}</b>

        <button onclick="change('${encodeURIComponent(c.id)}',1)">＋</button>

      </div>

      <button class="edit" onclick="editCard('${encodeURIComponent(c.id)}')">編集</button>

      <div class="photo-actions">

        <button onclick="choosePhoto('${encodeURIComponent(c.id)}')">📷 写真登録</button>

        ${c.photo?`<button onclick="removePhoto('${encodeURIComponent(c.id)}')">🗑️ 写真削除</button>`:""}

      </div>

    </article>

  `).join("");

  for(const c of list){

    if(token!==renderToken)break;

    const area=document.querySelector(`.photo-area[data-photo-id="${CSS.escape(c.id)}"]`);

    if(!area)continue;

    if(!c.photo){

      area.innerHTML='<div class="photo-placeholder">📷 写真未登録</div>';

      continue;

    }

    try{

      const blob=await getPhoto(c.id);

      if(token!==renderToken)break;

      if(blob){

        const url=URL.createObjectURL(blob);

        photoUrls.set(c.id,url);

        area.innerHTML=

          `<img class="card-photo" src="${url}" alt="${esc(c.name||c.id)}">`;

      }else{

        area.innerHTML='<div class="photo-placeholder">📷 写真未登録</div>';

      }

    }catch{

      area.innerHTML='<div class="photo-placeholder">📷 写真を読み込めません</div>';

    }

  }

  const owned=cards.filter(c=>c.owned>0).length;

  const total=cards.length;

  const p=Math.round(owned/Math.max(total,1)*100);

  $("owned").textContent=owned;

  $("total").textContent=total;

  $("percent").textContent=p+"%";

  $("bar").style.width=p+"%";

}

function change(id,d){

  const c=cards.find(x=>x.id===decodeURIComponent(id));

  if(c){

    c.owned=Math.max(0,(c.owned||0)+d);

    persist();

  }

}

function openModal(c,isNew=false){

  editing=isNew?null:c.id;

  $("modalTitle").textContent=isNew?"カードを追加":"カードを編集";

  [

    ["fId","id"],

    ["fName","name"],

    ["fSet","set"],

    ["fRarity","rarity"],

    ["fType","type"],

    ["fCategory","category"],

    ["fBrand","brand"],

    ["fOwned","owned"]

  ].forEach(([a,b])=>{

    $(a).value=c[b]??"";

  });

  $("modal").classList.add("show");

}

function editCard(id){

  const c=cards.find(x=>x.id===decodeURIComponent(id));

  if(c)openModal(c);

}

function addCard(){

  openModal({

    id:"",

    set:"2弾",

    name:"",

    rarity:"",

    type:"",

    category:"",

    brand:"",

    owned:0

  },true);

}

function closeModal(){

  $("modal").classList.remove("show");

}

function saveCard(){

  const v={

    id:$("fId").value.trim(),

    name:$("fName").value.trim(),

    set:$("fSet").value.trim(),

    rarity:$("fRarity").value.trim(),

    type:$("fType").value.trim(),

    category:$("fCategory").value.trim(),

    brand:$("fBrand").value.trim(),

    owned:Math.max(0,Number($("fOwned").value)||0)

  };

  if(!v.id){

    alert("カード番号を入力してください");

    return;

  }

  if(editing){

    const i=cards.findIndex(x=>x.id===editing);

    if(i>=0){

      v.photo=cards[i].photo;

      cards[i]=v;

    }

  }else{

    if(cards.some(x=>x.id===v.id)){

      alert("そのカード番号は登録済みです");

      return;

    }

    cards.push(v);

  }

  closeModal();

  persist();

}

function choosePhoto(id){

  photoTargetId=decodeURIComponent(id);

  $("photoFile").click();

}

function resizeImage(file,maxSize=1600,quality=0.90){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>{

      const img=new Image();

      img.onload=()=>{

        const scale=Math.min(

          1,

          maxSize/Math.max(img.width,img.height)

        );

        const canvas=document.createElement("canvas");

        canvas.width=Math.round(img.width*scale);

        canvas.height=Math.round(img.height*scale);

        const ctx=canvas.getContext("2d");

        ctx.drawImage(img,0,0,canvas.width,canvas.height);

        canvas.toBlob(

          blob=>{

            if(blob)resolve(blob);

            else reject(new Error("画像変換失敗"));

          },

          "image/jpeg",

          quality

        );

      };

      img.onerror=reject;

      img.src=reader.result;

    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}

$("photoFile").addEventListener("change",async e=>{

  const file=e.target.files[0];

  if(!file||!photoTargetId)return;

  const c=cards.find(x=>x.id===photoTargetId);

  if(!c)return;

  try{

    const blob=await resizeImage(file);

    await savePhoto(c.id,blob);

    c.photo=true;

    persist();

  }catch{

    alert("写真の保存に失敗しました");

  }

  e.target.value="";

  photoTargetId=null;

});

async function removePhoto(id){

  const c=cards.find(x=>x.id===decodeURIComponent(id));

  if(!c)return;

  if(confirm("このカードの写真を削除しますか？")){

    try{

      await deletePhoto(c.id);

    }catch{}

    delete c.photo;

    persist();

  }

}

function resetOwned(){

  if(confirm("所持数をすべて0にしますか？")){

    cards.forEach(c=>c.owned=0);

    persist();

  }

}

function dataURLToBlob(dataURL){

  const parts=dataURL.split(",");

  const mime=(parts[0].match(/:(.*?);/)||[])[1]||"image/jpeg";

  const binary=atob(parts[1]);

  const bytes=new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){

    bytes[i]=binary.charCodeAt(i);

  }

  return new Blob([bytes],{type:mime});

}

function blobToDataURL(blob){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>resolve(reader.result);

    reader.onerror=reject;

    reader.readAsDataURL(blob);

  });

}

async function backup(){

  try{

    const photos={};

    for(const c of cards){

      if(c.photo){

        const blob=await getPhoto(c.id);

        if(blob){

          photos[c.id]=await blobToDataURL(blob);

        }

      }

    }

    const cleanCards=cards.map(c=>{

      const copy={...c};

      delete copy.memo;

      copy.photo=!!copy.photo;

      return copy;

    });

    const data={

      version:2,

      cards:cleanCards,

      photos

    };

    const a=document.createElement("a");

    a.href=URL.createObjectURL(

      new Blob(

        [JSON.stringify(data)],

        {type:"application/json"}

      )

    );

    a.download="aikatsu-encore-backup.json";

    a.click();

    setTimeout(()=>URL.revokeObjectURL(a.href),1000);

  }catch{

    alert("バックアップに失敗しました");

  }

}

$("file").addEventListener("change",async e=>{

  const f=e.target.files[0];

  if(!f)return;

  try{

    const r=await f.text();

    const d=JSON.parse(r);

    let importedCards;

    let photoData={};

    if(Array.isArray(d)){

      importedCards=d;

    }else if(Array.isArray(d.cards)){

      importedCards=d.cards;

      photoData=d.photos||{};

    }else{

      throw new Error("形式が違います");

    }

    for(const c of importedCards){

      if(typeof c.photo==="string"&&c.photo.startsWith("data:")){

        photoData[c.id]=c.photo;

        c.photo=true;

      }else{

        c.photo=!!c.photo;

      }

      delete c.memo;

    }

    await clearPhotoDB();

    cards=importedCards;

    for(const [id,dataURL] of Object.entries(photoData)){

      try{

        await savePhoto(id,dataURLToBlob(dataURL));

      }catch{}

    }

    persist();

    alert("バックアップを復元しました！");

  }catch{

    alert("読み込みに失敗しました");

  }

  e.target.value="";

});

$("search").placeholder="番号・名前・ブランドなどで検索";

["search","setFilter","rarityFilter","haveFilter","categoryFilter" ]

.forEach(id=>{

  $(id).addEventListener("input",render);

});

function removeMemoUI(){

  const input=$("fMemo");

  if(input){

    const field=input.closest(".field");

    if(field)field.remove();

  }

}

removeMemoUI();

async function migrateLegacyPhotos(){

  let changed=false;

  for(const c of cards){

    if(

      typeof c.photo==="string" &&

      c.photo.startsWith("data:")

    ){

      try{

        await savePhoto(c.id,dataURLToBlob(c.photo));

        c.photo=true;

        changed=true;

      }catch{}

    }

  }

  if(changed){

    localStorage.setItem(KEY,JSON.stringify(cards));

  }

}

(async()=>{

  await migrateLegacyPhotos();

  render();

})();

if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{

    navigator.serviceWorker.register("./sw.js");

  });

}
